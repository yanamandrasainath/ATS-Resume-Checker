<html lang="en" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Step-by-Step Resume Builder</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="build.css">
  <style>@view-transition { navigation: auto; }</style>

 <body class="h-full">
  <div class="app-wrapper">
   <div class="content-area">
    <div class="container-max"><!-- Header -->
     <div class="header">
      <h1 id="appTitle">Step-by-Step Resume Builder</h1>
      <p id="appSubtitle">Build Your Professional Resume in Minutes</p>
     </div>
     <div class="main-grid"><!-- Left Panel: Form -->
      <div class="glass-card"><!-- Template Selection -->
       <div id="templateSection">
        <h2 class="text-xl font-bold text-gray-800 mb-4">Select Template</h2>
        <div class="template-grid" id="templateGrid"><!-- Templates will be populated here -->
        </div>
       </div><!-- Progress Bar -->
       <div class="progress-section" id="progressSection" style="display: none;">
        <div class="progress-label"><span id="progressText">Personal Info</span> <span id="progressCount">1 of 6</span>
        </div>
        <div class="progress-bar">
         <div class="progress-fill" id="progressFill" style="width: 16.67%"></div>
        </div>
       </div><!-- Form Slides -->
       <div class="slide-container" id="slideContainer" style="display: none;"><!-- Slides will be populated here -->
       </div><!-- Button Group -->
       <div class="button-group" id="buttonGroup" style="display: none;"><button class="btn-secondary" id="prevBtn" onclick="previousSlide()">← Previous</button> <button class="btn-primary" id="nextBtn" onclick="nextSlide()">Next →</button>
       </div>
      </div><!-- Right Panel: Preview -->
      <div class="glass-card">
       <div class="preview-title">
        Resume Preview
       </div>
       <div class="resume-preview" id="resumePreview">
        <div class="empty-state">
         <div class="empty-state-icon">
          📄
         </div>
         <p>Select a template to begin building your resume</p>
        </div>
       </div>
      </div>
     </div>
    </div>
   </div>
  </div>
